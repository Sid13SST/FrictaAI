server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # Proxy API calls to the backend service (Docker Compose service name: backend).
    location /api/ {
        proxy_pass http://backend:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Server-Sent Events (realtime streams) must not be buffered.
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    # SPA fallback — client-side routing handles the rest.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|svg|woff2?|ttf|eot|png|jpg|jpeg|gif|webp|mp4)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }
}
