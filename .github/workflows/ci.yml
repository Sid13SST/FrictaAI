name: CI/CD Quality Gate Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate:
    name: Code Validation and Testing
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: fricta_test
          POSTGRES_USER: fricta
          POSTGRES_PASSWORD: fricta_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://fricta:fricta_dev@localhost:5432/fricta_test?schema=public
      REDIS_URL: redis://localhost:6379
      PORT: 3001
      NODE_ENV: test
      CLERK_SECRET_KEY: sk_test_dummy_clerk_secret_key_for_tests
      CLERK_PUBLISHABLE_KEY: pk_test_dummy_clerk_publishable_key_for_tests

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Type Check Gate
        run: npm run typecheck

      - name: Lint Gate
        run: npm run lint

      - name: Database Schema Setup (Prisma Migrate Deploy)
        run: npx prisma migrate deploy --schema=packages/db/prisma/schema.prisma

      - name: Run Unit Tests with Coverage
        run: npm run test:coverage --workspace=@fricta/backend

      - name: Run Integration & Resilience Tests
        run: npm run test:integration --workspace=@fricta/backend

      - name: Security and Vulnerability Audit
        run: npm audit --audit-level=high

      - name: Build Validation - Packages
        run: npx turbo run build --filter="./packages/*"

      - name: Build Validation - Backend App
        run: npx turbo run build --filter="@fricta/backend"

      - name: Build Validation - Frontend App
        run: npx turbo run build --filter="@fricta/frontend"

      - name: Upload Coverage Reports Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: apps/backend/coverage/

      - name: Upload Test & Performance Results Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-and-performance-reports
          path: |
            apps/backend/test-results/
            apps/backend/test-results/**/*.xml
            apps/backend/test-results/**/*.json
