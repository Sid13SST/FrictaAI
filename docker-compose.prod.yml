version: '3.8'

# Full production stack: Postgres, Redis, backend API, and the frontend
# (served by nginx, which also proxies /api to the backend container).
#
# Local use (see docs/LOCAL_RUN.md):
#   scripts/local-preflight.sh
#   docker compose -f docker-compose.prod.yml --env-file .env up --build -d
#   open http://localhost:8080   (FRONTEND_PORT, default 8080)
#
# Required in .env (see .env.example): POSTGRES_PASSWORD, TOKEN_ENCRYPTION_KEY,
# CLERK_SECRET_KEY, CLERK_PUBLISHABLE_KEY, VITE_CLERK_PUBLISHABLE_KEY and
# OPENROUTER_API_KEY (or AGENT_BASE_URL). Ports bind to 127.0.0.1 only: this
# file is for running on your own machine, not for public exposure.

services:
  postgres:
    image: postgres:16-alpine
    container_name: fricta-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fricta}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-fricta}
    volumes:
      - fricta_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-fricta}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: fricta-redis
    restart: unless-stopped
    volumes:
      - fricta_redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: fricta-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      # Always the compose services. A DATABASE_URL / REDIS_URL in .env written
      # for local dev (localhost) would point at the backend container itself.
      DATABASE_URL: postgresql://${POSTGRES_USER:-fricta}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-fricta}?schema=public
      REDIS_URL: redis://redis:6379
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
      CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:?TOKEN_ENCRYPTION_KEY is required in production}
    env_file:
      - .env
    ports:
      - '127.0.0.1:3001:3001'
    volumes:
      - fricta_storage:/app/storage

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY}
        VITE_API_BASE: /api
    container_name: fricta-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - '127.0.0.1:${FRONTEND_PORT:-8080}:80'

volumes:
  fricta_pgdata:
  fricta_redisdata:
  fricta_storage:
